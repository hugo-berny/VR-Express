      - generic [ref=e16]:
        - heading "Importación express de EEUU a México" [level=1] [ref=e17]
        - paragraph [ref=e18]: Somos tus aliados para importar en México de una manera segura y confiable.
      - img "[PROVISIONAL] Contenedor de envío" [ref=e20]
    - region [ref=e22]:
      - heading "¿Qué hacemos?" [level=2] [ref=e23]
      - paragraph [ref=e24]:
        - text: Somos
        - strong [ref=e25]: VR Express
        - text: ", especialistas en importar de Estados Unidos a México. Nos encargamos de todo el proceso: recibimos y almacenamos tu mercancía, gestionamos el despacho aduanal y la entregamos en destino, con seguimiento en tiempo real. Conocemos los permisos, normas y clasificación arancelaria de cada sector, para que tu importación llegue completa y en regla."
    - region [ref=e26]:
      - generic [ref=e27]:
        - heading "Nuestros servicios" [level=2] [ref=e28]
        - list [ref=e29]:
          - listitem [ref=e30]:
            - heading "Importaciones de EEUU a México" [level=3] [ref=e31]
            - paragraph [ref=e32]: "Movemos mercancías de forma segura y eficiente entre ambos países. Nos encargamos de todo: almacenaje, inventarios, despacho aduanal y entrega final, con seguimiento en tiempo real y soporte en ambos lados de la frontera."
            - link "Ver Importaciones de EEUU a México" [ref=e33] [cursor=pointer]:
              - /url: pages/servicios/index.html
          - listitem [ref=e36]:
            - heading "Soluciones Logísticas Integrales" [level=3] [ref=e37]
            - paragraph [ref=e38]: Cada negocio es diferente, y su logística también. Diseñamos rutas, estrategias y procesos adaptados a cada necesidad, optimizando tiempos y costos en cada envío.
            - link "Ver Soluciones Logísticas Integrales" [ref=e39] [cursor=pointer]:
              - /url: pages/servicios/index.html
          - listitem [ref=e42]:
            - heading "Gestión Aduanal y Documental" [level=3] [ref=e43]
            - paragraph [ref=e44]: Nos ocupamos de toda la documentación requerida para importar o exportar sin contratiempos. Pedimentos, Certificados, Normas, Permisos y Clasificación Arancelaria. Todo bajo control y conforme a la normativa vigente.
            - link "Ver Gestión Aduanal y Documental" [ref=e45] [cursor=pointer]:
              - /url: pages/servicios/index.html
          - listitem [ref=e48]:
            - heading "Soluciones Especiales por Sector" [level=3] [ref=e49]
            - paragraph [ref=e50]: Desarrollamos soluciones específicas para industrias como textil, tecnológica, maquinaria, mobiliario, suplementos, entre otras. Conocemos las particularidades de cada padrón sectorial para garantizar envíos seguros y documentados.
            - link "Ver Soluciones Especiales por Sector" [ref=e51] [cursor=pointer]:
              - /url: pages/servicios/index.html
          - listitem [ref=e54]:
            - heading "Gestión Global de Proveedores" [level=3] [ref=e55]
            - paragraph [ref=e56]: Facilitamos la relación con proveedores en el extranjero. Contamos con staff bilingüe para coordinar órdenes de compra, pagos internacionales y condiciones comerciales (Incoterms), así como supervisar cada etapa logística hasta entrega.
            - link "Ver Gestión Global de Proveedores" [ref=e57] [cursor=pointer]:
              - /url: pages/servicios/index.html
    - region [ref=e61]:
